:root{--red:#d71920;--dark:#101010;--gold:#e0a823}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}

<script>

{id:'b1',title:'நிலா முற்றத்து நினைவுகள்',author:'மாலதி சேகர்',publisher:'உங்கள் பதிப்பகம்',genre:'சிறுகதைகள்',oldP:'250',newP:'199'},
{id:'b2',title:'காலத்தின் கரையில்',author:'அருண்மொழி',publisher:'உங்கள் பதிப்பகம்',genre:'நாவல்',oldP:'320',newP:'275'},
{id:'b3',title:'எளிய தமிழில் அறிவியல்',author:'முனைவர் இளங்கோ',publisher:'உங்கள் பதிப்பகம்',genre:'அறிவியல்',oldP:'180',newP:'150'}];

function load(){

function build(){
var row=$('#row');row.innerHTML='';els=[];

var d=document.createElement('div');d.className='bk';d.dataset.i=i;

d.innerHTML='<div class="cv">'+(c?'<img alt="'+esc(b.title)+'" src="'+c+'">':'<div class="ph" style="background:linear-gradient(150deg,'+PH[i%5]+',#1c120a)">'+esc(b.title)+'</div>')+'</div>';

var n=books.length;

});

var done={};
function snap(url,max,type,cb){var im=new Image();im.onload=function(){var k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));try{c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL(type,.8))}catch(e){}};im.src=url}

}

/* pdf.js இனி பக்கத்தைத் தடுக்காது: பின்னணியில் ஏற்றப்படும்; PDF திறக்கும் முன் loadPdfJs() காத்திருக்கும் */
var _pdfP=null;
function loadPdfJs(){
  if(window.pdfjsLib)return Promise.resolve();
  if(_pdfP)return _pdfP;
  _pdfP=new Promise(function(ok,no){
    var s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=function(){ok()};
    s.onerror=function(){_pdfP=null;s.remove();no(new Error('pdf.js'))};
    document.head.appendChild(s);
  });
  return _pdfP;
}

<script>
const ADMIN=(()=>{try{return localStorage.getItem('np_admin_device')==='1'}catch(e){return false}})();
const $=s=>document.querySelector(s),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const stage=$('#stage');
let curBuf=null,curName="",pdf=null,fb=null;
/* ---------- storage ---------- */
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('epaper',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=rej});
async function dbSet(k,v){try{(await idb()).transaction('kv','readwrite').objectStore('kv').put(v,k)}catch(e){}}
async function dbGet(k){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
/* ---------- controls ---------- */
const today=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return p(d.getDate())+'-'+p(d.getMonth()+1)+'-'+d.getFullYear()};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.remove('on');void t.offsetWidth;t.classList.add('on')};
const dlDateStr=()=>{const v=ls.get('np_dldate');if(v&&/^\d{4}-\d{2}-\d{2}$/.test(v)){const[y,m,d]=v.split('-');return d+'-'+m+'-'+y}return today()};
$('#pick').onclick=()=>{location.href='settings.html#epaper'};
if(!ADMIN){const e=$('#empty');if(e){const p=e.querySelector('p');if(p)p.textContent='இன்றைய இதழ் விரைவில் வெளியாகும். அதுவரை Mobile TV, கட்டுரைகளைப் பாருங்கள்.';$('#pick').remove()}}
/* ---------- app interface: காட்சிகள் மட்டும் — E-Paper | Mobile TV | Book Shelf ----------
   எல்லா மாற்றங்களும் (PDF, செய்தி, புத்தகம், தோற்றம்…) settings.html பக்கத்தில் செய்யப்படும். */
const SECS=[['books','Books','📚'],['article','Articles','📝'],['shopping','Shopping','🛒'],['events','Events','🎪']];
const SEC_ONLY=['article','shopping','events'];
const VIEWS=['paper','tv','books',...SEC_ONLY],SET_TAB={paper:'epaper',tv:'tv',books:'shelf',article:'articles',shopping:'shopping',events:'events'};
let names={};try{names=JSON.parse(ls.get('np_tabs')||'{}')||{}}catch(e){}
const secName=id=>names[id]||(SECS.find(x=>x[0]===id)||[0,id])[1];
let view='paper',bkMode='shelf',lastBook=0,ifr=null,bifr=null,lifr=null;
const FRAME_ALLOW='camera;microphone;fullscreen;autoplay;clipboard-write;display-capture';
function show(v){
  if(!VIEWS.includes(v))v='paper';
  view=v;if(v!=='books')bkMode='shelf';
  $('#tv').classList.toggle('on',v==='tv');
  $('#bk').classList.toggle('on',v==='books');
  $('#lib').classList.toggle('on',v==='books'&&bkMode==='shelf');
  $('#bkBar').classList.toggle('on',v==='books'&&bkMode==='play');
  $('#app').classList.toggle('fs',v==='books'&&bkMode==='play');
  const isSec=SEC_ONLY.includes(v);
  $('#sec').classList.toggle('on',isSec);
  if(isSec)renderSec(v);
  /* பொத்தான் 1 (2-in-1): E-Paper-ல் இருந்தால் Mobile TV; மற்ற இடங்களில் E-Paper */
  const toTv=v==='paper';
  $('#modeBtn').dataset.go=toTv?'tv':'paper';
  $('#modeIco').textContent=toTv?'📺':'📰';$('#modeLbl').textContent=toTv?'Mobile TV':'E-Paper';
  $('#modeBtn').setAttribute('aria-label',toTv?'Mobile TV':'E-Paper');
  $('#shelfBtn').classList.toggle('on',v==='books'||isSec);
  document.querySelectorAll('#subBar button').forEach(b=>b.classList.toggle('on',b.dataset.id===v));
  closeSub();
  /* பொத்தான் 3 (2-in-1): E-Paper-ல் Download + PDF தேதி; மற்ற பக்கங்களில் செட்டிங்ஸ் */
  const dl=v==='paper';
  $('#actBtn').dataset.act=dl?'dl':'set';
  $('#actIco').textContent=dl?'⬇':'⚙';
  $('#actLbl').textContent=dl?dlDateStr():'செட்டிங்ஸ்';
  $('#actBtn').setAttribute('aria-label',dl?'Download '+dlDateStr():'செட்டிங்ஸ்');
  /* Mobile TV: இந்தக் காட்சிக்கு வரும்போது மட்டும் இயங்கும் (பேட்டரி சேமிப்பு) */
  if(v==='tv'&&!ifr){ifr=document.createElement('iframe');ifr.allow=FRAME_ALLOW;ifr.src='news.html?mode=view';$('#tv').appendChild(ifr)}
  if(v!=='tv'&&ifr){ifr.remove();ifr=null}
  if(v==='books'){ensureBk();if(bkMode==='shelf'){const a=bkApi();if(a)a.setMode('')}}
  else{const a=bkApi();if(a)a.setMode('')}
  if(v==='books'&&bkMode==='shelf')openLib();
  try{history.replaceState(null,'','#'+v)}catch(e){}
}
/* ===== Book Shelf: முதலில் புத்தக அலமாரி; தொட்ட புத்தகத்தின் வீடியோ மட்டும் ஓடும் ===== */
const rawSrc=id=>document.getElementById(id).textContent.replace(/<\\\/script/g,'</script');
function ensureBk(){
  if(!bifr){
    bifr=document.createElement('iframe');bifr.allow=FRAME_ALLOW;
    bifr._p=new Promise(res=>{bifr.addEventListener('load',()=>{
      try{const w=bifr.contentWindow;const s=w.document.createElement('script');s.textContent=rawSrc('linkSrc');w.document.body.appendChild(s)}catch(e){console.warn('shelf link',e)}
      res();
    })});
    bifr.src='book.html?mode=view';$('#bk').appendChild(bifr);
  }
  return bifr._p;
}
function bkApi(){try{return bifr&&bifr.contentWindow.__shelfAPI||null}catch(e){return null}}
window.__shelfAPI={
  state(){const a=bkApi();return a?a.state():null},
  media(){const a=bkApi();return a?a.media():null},
  playAt(i){bkMode='play';lastBook=i;show('books');const a=bkApi();if(a)setTimeout(()=>a.playSolo(i),250)},
  edit(){location.href='settings.html#shelf'},
  close(){show('paper')}
};
function toShelf(){const a=bkApi();if(a)a.setMode('');bkMode='shelf';show('books')}
function openLib(){
  ensureBk().then(()=>{
    if(view!=='books'||bkMode!=='shelf')return;
    if(lifr&&lifr.isConnected){try{lifr.contentWindow.__refresh()}catch(e){}return}

  });
}
$('#bkBack').onclick=toShelf;
$('#bkAgain').onclick=()=>{const a=bkApi();if(a)a.playSolo(lastBook)};
$('#modeBtn').onclick=()=>{bkMode='shelf';show($('#modeBtn').dataset.go||'tv')};
$('#actBtn').onclick=()=>{if($('#actBtn').dataset.act==='dl')downloadPdf();else location.href='settings.html#'+(SET_TAB[view]||'epaper')};
/* பொத்தான் 2: Book Shelf — கீழே துணைத் தலைப்புகள் */
function closeSub(){$('#subBar').classList.remove('on');$('#shelfBtn').setAttribute('aria-expanded','false');$('#shelfBtn .arr').textContent='▾'}
function openSub(){$('#subBar').classList.add('on');$('#shelfBtn').setAttribute('aria-expanded','true');$('#shelfBtn .arr').textContent='▴'}
(function(){const sb=$('#subBar');
  SECS.forEach(([id,def,ico])=>{const b=document.createElement('button');b.type='button';b.dataset.id=id;b.innerHTML='<span class="ico">'+ico+'</span><span>'+secName(id)+'</span>';b.onclick=()=>{bkMode='shelf';show(id)};sb.appendChild(b)});
  $('#shelfBtn').onclick=e=>{e.stopPropagation();sb.classList.contains('on')?closeSub():openSub()};
  document.addEventListener('click',e=>{if(!e.target.closest('#subBar')&&!e.target.closest('#shelfBtn'))closeSub()});
})();
/* Books தவிர்த்த பிரிவுகள் — பார்வை மட்டும் (திருத்துதல் செட்டிங்ஸில்) */
function renderSec(id){
  const sc=$('#sec');
  if(id!=='shopping'&&window.Market)Market.unmount(sc);if(id!=='events'&&window.Banner)Banner.unmount(sc);
  if(id==='article'&&window.ArticleShelf){if(window.PostBoard)PostBoard.unmount(sc);ArticleShelf.mount(sc,$('#main'));return}
  if(window.ArticleShelf)ArticleShelf.unmount(sc);
  if((id==='shopping'||id==='events')&&window.PostBoard){PostBoard.mount(sc,$('#main'),id);return}
  const t=ls.get('np_s_'+id)||'';let meta=[];try{meta=JSON.parse(ls.get('np_si_'+id)||'[]')||[]}catch(e){}
  sc.innerHTML='<h2></h2><div class="gal"></div>'+(t.trim()?'<div class="body"></div>':'')+(!t.trim()&&!meta.length?'<div class="none">இந்தப் பகுதியில் உள்ளடக்கம் இல்லை.'+(ADMIN?'<br><a href="settings.html#sections">செட்டிங்ஸில் சேர்க்கவும்</a>':'')+'</div>':'');
  sc.querySelector('h2').textContent=secName(id);
  const b=sc.querySelector('.body');if(b)b.textContent=t;
  const g=sc.querySelector('.gal');
  if(!meta.length){g.remove();return}
  meta.forEach(m=>{
    const f=document.createElement('figure');const im=document.createElement('img');im.alt=m.cap||'';im.loading='lazy';f.appendChild(im);
    if(m.cap){const c=document.createElement('figcaption');c.textContent=m.cap;f.appendChild(c)}
    f.onclick=()=>{if(!im.src)return;const o=document.createElement('div');o.className='zoom';const z=document.createElement('img');z.src=im.src;o.appendChild(z);o.onclick=()=>o.remove();$('#main').appendChild(o)};
    g.appendChild(f);
    if(window.MediaStore)MediaStore.get(m.k).then(u=>{if(u)im.src=u;else f.remove()});
  });
}
/* Download — E-Paper கீழ்க் கருவிப்பட்டியில் */
function downloadPdf(){
  if(!curBuf){toast(ADMIN?'முதலில் செட்டிங்ஸில் PDF-ஐச் சேர்க்கவும்':'இன்றைய இதழ் இன்னும் வெளியாகவில்லை');return}

}
/* செட்டிங்ஸில் இருந்து திரும்பும்போது (back / bfcache) புதிய தரவுடன் ஏற்று */
addEventListener('pageshow',e=>{if(e.persisted)location.reload()});
/* புத்தக ஸ்டுடியோ media ஏற்றி முடிந்ததும் அலமாரியைப் புதுப்பி */
addEventListener('message',e=>{if(e.data&&e.data.bkReady&&lifr){try{lifr.contentWindow.__refresh()}catch(err){}}});
show((location.hash||'').slice(1)||'tv');
addEventListener('message',e=>{if(e.data&&e.data.goto==='paper')show('paper')});
function hideHint(){$('#hint').classList.remove('on')}
function getFb(){
  if(!fb)fb=new FlipBook(stage,{
    layout:()=>'single',
    minimal:true,
    isActive:()=>view==='paper',
    toast:m=>toast(m),
    onPage:i=>{dbSet('pg',i);hideHint()}
  });
  return fb;
}
async function openBuf(buf,name,page,save){
  $('#load').classList.add('on');
  try{
    await loadPdfJs();
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise;
    curBuf=buf;curName=name;$('#empty').style.display='none';
    if(save){dbSet('pdf',{name,buf});dbSet('pg',page||0)}
    await getFb().open(pdf,page||0);
    const h=$('#hint');h.classList.remove('on');void h.offsetWidth;h.classList.add('on');
  }catch(err){console.error(err);alert('PDF திறக்க முடியவில்லை. இணைய இணைப்பு (pdf.js) அல்லது கோப்பைச் சரிபார்க்கவும்.')}
  $('#load').classList.remove('on');
}
/* செட்டிங்ஸில் பக்க அமைப்பு மாற்றினால் உடனே பொருந்தும் */
(async()=>{const d=await dbGet('pdf');if(d&&d.buf){const p=await dbGet('pg');openBuf(d.buf,d.name,p||0,false)}})();
