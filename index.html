<!doctype html>
<html lang="ta"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#8B0000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>தீக்கதிர் E-Paper</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="theme.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg,#0a0a0a);color:var(--ink,#fff);font-family:"Noto Sans Tamil",system-ui,sans-serif}
#app{display:flex;flex-direction:column;height:100%;position:relative}
#bar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel,#1a1a1a);border-bottom:1px solid var(--border,#333);z-index:20;flex-shrink:0}
#bar button,#bar label{border:none;background:var(--btn,#2a2a2a);color:var(--ink,#fff);padding:8px 12px;border-radius:8px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
#bar button:active{opacity:.85}
#bTv{background:var(--yel,#FFD700);color:#111;font-weight:600}
#bDl{margin-left:auto;background:var(--red,#8B0000);color:#fff}
#dlDate{background:var(--btn,#2a2a2a);color:var(--ink);border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-size:12px;max-width:130px}
#viewer{flex:1;position:relative;overflow:hidden;background:#111;touch-action:none}
#c{position:absolute;inset:0;width:100%;height:100%}
#status{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);padding:6px 14px;border-radius:20px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .3s}
#status.show{opacity:1}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
<div id="bar">
<button id="bTv" type="button"><span id="tvIcon"></span><span id="tvLabel">Mobile TV</span></button>
<input type="date" id="dlDate" title="தேதி">
<button id="bDl" type="button">Download</button>
</div>
<div id="viewer"><canvas id="c"></canvas><div id="status"></div></div>
</div>
<script>
const ICO_TV='<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>';
const ICO_PAPER='<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>';
function updateToggle(isTv){
  const lab=document.getElementById('tvLabel');
  const ico=document.getElementById('tvIcon');
  if(isTv){lab.textContent='E-Paper';ico.innerHTML=ICO_PAPER;}
  else{lab.textContent='Mobile TV';ico.innerHTML=ICO_TV;}
}
updateToggle(false);
document.getElementById('bTv').onclick=()=>{location.href='news.html';};
// PDF + theme + rest of e-paper logic continues in full file
</script>
</body></html>
