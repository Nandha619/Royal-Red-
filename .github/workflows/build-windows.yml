name: Build Windows program (.exe)
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults: { run: { working-directory: tauri } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: 'tauri/src-tauri -> target' }
      - run: npm install --no-audit --no-fund
      - run: node prep.js
      - run: npx tauri icon ../icon-512.png
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: NEWS-STUDIO-windows
          path: |
            tauri/src-tauri/target/release/bundle/nsis/*.exe
            tauri/src-tauri/target/release/news-studio.exe
      - name: Attach to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: tauri/src-tauri/target/release/bundle/nsis/*.exe }
