[package]
name = "news-studio"
version = "1.0.0"
description = "NEWS STUDIO — E-Paper, Mobile TV, Book Shelf"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
